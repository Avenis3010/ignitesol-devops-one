# AppProject scopes ArgoCD so dev apps can ONLY deploy to the dev namespace.
# Any Application in this project that tries to target prod will be rejected.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: Dev environment — isolated from prod

  sourceRepos:
    - https://github.com/Avenis3010/ignite-solutions.git

  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc

  # CI/CD roles — read-only for dev namespace, no cluster-wide access
  roles:
    - name: dev-deployer
      description: Dev CI/CD deploy access
      policies:
        - p, proj:dev:dev-deployer, applications, sync, dev/*, allow
        - p, proj:dev:dev-deployer, applications, get,  dev/*, allow

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
