apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-api-prod
  namespace: argocd
  labels:
    environment: prod
    project: central-platform
  annotations:
    # Prod deployments require a PR merged to production branch,
    # passing all required status checks, and a manual approval in GitHub.
    deploy/policy: "pr-review-required"
spec:
  project: prod
  source:
    repoURL: https://github.com/Avenis3010/ignite-solutions.git
    targetRevision: production
    path: backend-services/users-api/backend-api
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # automated sync is OFF for prod — pipeline triggers sync explicitly
    # after GitHub environment approval gate passes
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
