name: Dev Pipeline

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION:   ap-south-1
  EKS_CLUSTER:  central-platform-dev-eks    # dev-only cluster

jobs:

  # ─── DETECT CHANGES ─────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-services/**'
            frontend:
              - 'frontend-services/**'
            database:
              - 'migrations/dev/**'

  # ─── BACKEND ────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Deploy Backend (dev)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPO_DEV }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          cd backend-services/users-api
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest

      - name: Update image tag in values-dev.yaml
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" \
            backend-services/users-api/backend-api/values-dev.yaml
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backend-services/users-api/backend-api/values-dev.yaml
          git commit -m "chore: update dev image tag to ${{ github.sha }}" || echo "No changes"
          git push

      - name: Update kubeconfig (dev cluster)
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Apply namespace + network policy
        run: |
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev/network-policy.yaml

      - name: Apply ArgoCD project + app
        run: |
          kubectl apply -f argocd/project-dev.yaml
          kubectl apply -f argocd/backend-dev.yaml

      - name: Install ArgoCD CLI
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/v2.14.7/argocd-linux-amd64
          sudo chmod +x /usr/local/bin/argocd

      - name: Sync ArgoCD dev app
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure --grpc-web
          argocd app terminate-op backend-api-dev --grpc-web 2>/dev/null || true
          sleep 3
          argocd app sync backend-api-dev --grpc-web --force
          argocd app wait backend-api-dev --sync --health --timeout 120 --grpc-web

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Deploy Frontend (dev)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-services/frontend-apps/web-ui/package-lock.json

      - name: Install & build
        run: |
          cd frontend-services/frontend-apps/web-ui
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (dev bucket)
        run: |
          aws s3 sync frontend-services/frontend-apps/web-ui/build/ \
            s3://${{ vars.S3_BUCKET_NAME_DEV }}/ --delete

      - name: Invalidate CloudFront (dev distribution)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEV }} \
            --paths "/*"

  # ─── DATABASE ───────────────────────────────────────────────────────────────
  database-migration:
    name: Database Migration (dev)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.database == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATABASE_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (dev cluster)
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Bootstrap namespace + ESO
        run: |
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev/network-policy.yaml
          kubectl apply -f external-secrets/service-accounts.yaml
          kubectl apply -f external-secrets/secret-store-dev.yaml

      - name: Apply configmap & run migration
        run: |
          kubectl apply -f migrations/dev/configmap.yaml
          kubectl delete job mysql-migration -n dev --ignore-not-found=true
          kubectl apply -f migrations/dev/migration-job.yaml
          kubectl wait --for=condition=complete job/mysql-migration -n dev --timeout=300s

      - name: Print migration logs
        run: kubectl logs job/mysql-migration -n dev
