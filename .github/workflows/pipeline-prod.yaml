name: Prod Pipeline

on:
  push:
    branches:
      - production

# Prod deploys never cancel in-progress — a running prod deploy must finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  security-events: write   # upload Trivy SARIF to GitHub Security tab

env:
  AWS_REGION:  ap-south-1
  EKS_CLUSTER: central-platform-prod-eks    # prod-only cluster

jobs:

  # ─── DETECT CHANGES ─────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-services/**'
            frontend:
              - 'frontend-services/**'
            database:
              - 'migrations/prod/**'

  # ─── BACKEND ────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Deploy Backend (prod)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    # Manual approval gate — configure at:
    # GitHub → Settings → Environments → prod-backend → Required reviewers
    environment: prod-backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image (local — before scan)
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPO_PROD }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          cd backend-services/users-api
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # ── Trivy image scan — CRITICAL + HIGH blocks prod deploy ────────────────
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_BACKEND_REPO_PROD }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH  # stricter than dev — HIGH also blocks prod
          exit-code: "1"

      - name: Upload Trivy image results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Push backend image to ECR
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPO_PROD }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest

      - name: Update values-prod.yaml with image tag + audit metadata
        run: |
          DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VALUES=backend-services/users-api/backend-api/values-prod.yaml
          sed -i "s|^  tag:.*|  tag: ${{ github.sha }}|" $VALUES
          sed -i "s|  gitSha:.*|  gitSha: \"${{ github.sha }}\"|"      $VALUES
          sed -i "s|  gitRef:.*|  gitRef: \"${{ github.ref_name }}\"|"  $VALUES
          sed -i "s|  deployedBy:.*|  deployedBy: \"${{ github.actor }}\"|" $VALUES
          sed -i "s|  deployTime:.*|  deployTime: \"${DEPLOY_TIME}\"|"   $VALUES
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add $VALUES
          git commit -m "chore(prod): deploy ${{ github.sha }} by ${{ github.actor }}" || echo "No changes"
          git push

      - name: Update kubeconfig (prod cluster)
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Apply namespace + network policy
        run: |
          kubectl apply -f k8s/prod/namespace.yaml
          kubectl apply -f k8s/prod/network-policy.yaml

      - name: Apply ArgoCD project + app
        run: |
          kubectl apply -f argocd/project-prod.yaml
          kubectl apply -f argocd/backend-prod.yaml

      - name: Install ArgoCD CLI
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/v2.14.7/argocd-linux-amd64
          sudo chmod +x /usr/local/bin/argocd

      - name: Sync ArgoCD prod app
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure --grpc-web
          argocd app terminate-op backend-api-prod --grpc-web 2>/dev/null || true
          sleep 3
          argocd app sync backend-api-prod --grpc-web --force
          argocd app wait backend-api-prod --sync --health --timeout 120 --grpc-web

  # ─── FRONTEND ───────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Deploy Frontend (prod)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    environment: prod-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-services/frontend-apps/web-ui/package-lock.json

      - name: Install & build
        run: |
          cd frontend-services/frontend-apps/web-ui
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (prod bucket)
        run: |
          aws s3 sync frontend-services/frontend-apps/web-ui/build/ \
            s3://${{ vars.S3_BUCKET_NAME_PROD }}/ --delete

      - name: Invalidate CloudFront (prod distribution)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*"

  # ─── DATABASE ───────────────────────────────────────────────────────────────
  database-migration:
    name: Database Migration (prod)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.database == 'true'
    environment: prod-database
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DATABASE_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (prod cluster)
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Bootstrap namespace + ESO
        run: |
          kubectl apply -f k8s/prod/namespace.yaml
          kubectl apply -f k8s/prod/network-policy.yaml
          kubectl apply -f external-secrets/service-accounts.yaml
          kubectl apply -f external-secrets/secret-store-prod.yaml

      - name: Apply configmap & run migration
        run: |
          kubectl apply -f migrations/prod/configmap.yaml
          kubectl delete job mysql-migration -n prod --ignore-not-found=true
          kubectl apply -f migrations/prod/migration-job.yaml
          kubectl wait --for=condition=complete job/mysql-migration -n prod --timeout=300s

      - name: Print migration logs
        run: kubectl logs job/mysql-migration -n prod
