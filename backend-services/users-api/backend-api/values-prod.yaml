replicaCount: 2

image:
  repository: 758024567313.dkr.ecr.ap-south-1.amazonaws.com/backend-api-dev
  pullPolicy: IfNotPresent
  # tag is overwritten by CI/CD pipeline on every deploy — never set to "latest"
  tag: e9d80b8e9bb29323c3f0e785ccf04f09469f83d9

# ── Audit metadata ────────────────────────────────────────────────────────────
audit:
  environment: prod
  gitSha:      "unknown"   # overwritten: --set audit.gitSha=$GITHUB_SHA
  gitRef:      "unknown"   # overwritten: --set audit.gitRef=$GITHUB_REF_NAME
  deployedBy:  "unknown"   # overwritten: --set audit.deployedBy=$GITHUB_ACTOR
  deployTime:  "unknown"   # overwritten: --set audit.deployTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: shared-alb
  paths:
    - path: /prod
      pathType: Prefix

env:
  - name: APP_ENV
    value: "prod"

livenessProbe:
  httpGet:
    path: /prod/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /prod/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
