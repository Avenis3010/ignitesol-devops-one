apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-api.fullname" . }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
    # ── Audit labels — visible in: kubectl describe deployment/<name> ──────────
    app.kubernetes.io/version:     {{ .Values.image.tag | quote }}
    app.kubernetes.io/environment: {{ .Values.audit.environment | quote }}
    app.kubernetes.io/managed-by:  "argocd"
  annotations:
    # Static deploy context — written once at deploy time by CI/CD
    deploy/git-sha:      {{ .Values.audit.gitSha | quote }}
    deploy/git-ref:      {{ .Values.audit.gitRef | quote }}
    deploy/deployed-by:  {{ .Values.audit.deployedBy | quote }}
    deploy/deploy-time:  {{ .Values.audit.deployTime | quote }}
    deploy/image-tag:    {{ .Values.image.tag | quote }}
    deploy/environment:  {{ .Values.audit.environment | quote }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend-api.labels" . | nindent 8 }}
        app.kubernetes.io/version:     {{ .Values.image.tag | quote }}
        app.kubernetes.io/environment: {{ .Values.audit.environment | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Pod annotations — same values so they show on: kubectl describe pod/<name>
        deploy/git-sha:     {{ .Values.audit.gitSha | quote }}
        deploy/git-ref:     {{ .Values.audit.gitRef | quote }}
        deploy/deployed-by: {{ .Values.audit.deployedBy | quote }}
        deploy/deploy-time: {{ .Values.audit.deployTime | quote }}
        deploy/image-tag:   {{ .Values.image.tag | quote }}
        deploy/environment: {{ .Values.audit.environment | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backend-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Never use :latest — tag is always the exact git SHA set by CI/CD
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-secret
                  key: DB_PASSWORD
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
