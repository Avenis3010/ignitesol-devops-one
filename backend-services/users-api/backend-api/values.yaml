replicaCount: 1

image:
  repository: 758024567313.dkr.ecr.ap-south-1.amazonaws.com/backend-api-dev
  pullPolicy: IfNotPresent
  tag: ""   # always overridden by values-dev.yaml or values-prod.yaml

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

audit:
  environment: ""
  gitSha:     "unknown"
  gitRef:     "unknown"
  deployedBy: "unknown"
  deployTime: "unknown"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  paths: []

# ── Resource limits ────────────────────────────────────────────────────────────
# These are the base defaults. values-dev.yaml and values-prod.yaml override
# them with environment-appropriate sizing.
# requests: minimum guaranteed — used by the scheduler and HPA
# limits:   hard cap — container is OOMKilled if memory limit is exceeded;
#           CPU is throttled (not killed) if CPU limit is exceeded
resources:
  requests:
    cpu:    "100m"
    memory: "128Mi"
  limits:
    cpu:    "300m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
