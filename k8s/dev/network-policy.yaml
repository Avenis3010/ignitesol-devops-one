# Deny all ingress from the prod namespace into dev.
# Pods in dev can still talk to each other and reach the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-prod
  namespace: dev
spec:
  podSelector: {}          # applies to every pod in dev
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: environment
                operator: NotIn
                values:
                  - prod
