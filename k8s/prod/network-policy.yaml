# Deny all ingress from the dev namespace into prod.
# Pods in prod can still talk to each other and reach the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-dev
  namespace: prod
spec:
  podSelector: {}          # applies to every pod in prod
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: environment
                operator: NotIn
                values:
                  - dev
